<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press Expedition 50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <div class="hero-layer layer-photo"></div>
    <div class="hero-layer layer-text">
      <span class="word-expedition">EXPEDITION</span>
    </div>
    <div class="hero-layer layer-cutout"></div>
    <div class="hero-layer layer-fifty">
      <span class="word-fifty">50</span>
    </div>

    <!-- Layer 5 — Volumetric swirling fog -->
    <div class="hero-layer layer-fog">
      <canvas class="fog-canvas"></canvas>
    </div>

    <span class="hero-meta hero-meta--tl">47.972°N 123.508°W</span>
    <span class="hero-meta hero-meta--tr">AUG 8, 2026</span>
    <span class="hero-meta hero-meta--bl">MILE 50</span>
    <span class="hero-meta hero-meta--br">OLYMPIC NATIONAL FOREST</span>
  </section>

  <div class="content-spacer">
    <p>Content goes here.</p>
  </div>

<script src="app.js"></script>

</body>
</html>
