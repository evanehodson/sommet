<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press Expedition 50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Chivo+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="menu-bar">
    <span class="menu-brand">PRESS EXPEDITION <span class="menu-brand-num">50</span></span>
    <ul class="menu-links">
      <li>History</li>
      <li>Course</li>
      <li>Register</li>
      <li>Schedule</li>
      <li>Contact</li>
    </ul>
  </nav>

  <div class="hero-stage">
    <div class="hero-clip">
      <section class="hero">
        <div class="hero-layer layer-center layer-text">
          <span class="word-expedition">EXPEDITION</span>
        </div>
        <div class="hero-layer layer-cutout"></div>

        <div class="hero-layer layer-center layer-fifty">
          <span class="word-fifty">50</span>
        </div>

        <div class="hero-layer layer-fog">
          <canvas class="fog-canvas"></canvas>
        </div>
      </section>
    </div>

    <div class="hero-stat">
      <div class="map-stat">
        <div class="map-stat-title">Olympic National Park</div>
        <div class="map-stat-field">
          <span class="map-stat-key">COORD</span>
          <span class="map-stat-val">47°58'14"N 123°30'13"W</span>
        </div>
        <div class="map-stat-rule"></div>
        <div class="map-stat-field">
          <span class="map-stat-key">DIST</span>
          <span class="map-stat-val">50 MILES</span>
        </div>
        <div class="map-stat-rule"></div>
        <div class="map-stat-field">
          <span class="map-stat-key">GAIN</span>
          <span class="map-stat-val">7,749 FT ELEV</span>
        </div>
        <div class="map-stat-rule"></div>
        <div class="map-stat-field">
          <span class="map-stat-key">DATE</span>
          <span class="map-stat-val">AUG. 8</span>
        </div>
        <div class="map-stat-rule"></div>
        <div class="map-stat-field">
          <span class="map-stat-key">START</span>
          <span class="map-stat-val">9:00 AM PST</span>
        </div>
        <div class="map-stat-rule"></div>
        <div class="map-stat-field">
          <span class="map-stat-key">CUTOFF</span>
          <span class="map-stat-val">18:00:00</span>
        </div>
      </div>
    </div>
  </div>

  <div class="content-spacer">
    <p>Content goes here.</p>
  </div>

<script src="app.js"></script>

</body>
</html>
