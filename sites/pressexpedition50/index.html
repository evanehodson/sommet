<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Press Expedition 50</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <div class="hero-layer layer-text">
      <svg class="text-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
        <defs>
          <mask id="expeditionMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1440" height="900">
            <text x="720" y="500" text-anchor="middle" class="mask-text">EXPEDITION</text>
          </mask>
        </defs>
        <g mask="url(#expeditionMask)">
          <image class="mask-photo" href="pexels-brandie-9391031.jpg" x="0" y="0" width="1440" height="900" preserveAspectRatio="xMidYMid slice"/>
        </g>
      </svg>
    </div>
    <div class="hero-layer layer-cutout"></div>

    <div class="hero-layer layer-fog-far">
      <canvas class="fog-canvas-far"></canvas>
    </div>

    <div class="hero-layer layer-fifty">
      <span class="word-fifty">50</span>
    </div>

    <div class="hero-layer layer-fog">
      <canvas class="fog-canvas"></canvas>
    </div>

  </section>

  <div class="content-spacer">
    <p>Content goes here.</p>
  </div>

<script src="app.js"></script>

</body>
</html>
