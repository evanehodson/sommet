<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WURL Course Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Intro overlay -->
    <div id="intro-overlay">
        <div id="intro-content">
            <div id="intro-title">THE WURL</div>
            <div id="intro-line"></div>
            <div id="intro-subtitle">LITTLE COTTONWOOD CANYON · 35.6 MI</div>
        </div>
    </div>

    <div id="app-layout">
        <div id="scrollytelling-sidebar">
            <div id="sidebar-header">
                <div id="sidebar-brand">
                    <div id="sidebar-title-group">
                        <h2 id="sidebar-title">The WURL</h2>
                        <span id="sidebar-subtitle">35.6 mi · Little Cottonwood Canyon</span>
                    </div>
                </div>
                <button id="sidebar-close" title="Close">&times;</button>
            </div>
            <div id="sidebar-scroll-container"></div>
        </div>
        <div id="map-area">
            <div id="map"></div>

            <!-- Sidebar toggle — top left -->
            <button id="sidebar-toggle" class="ctrl" title="Scrollytelling">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                    <rect x="2" y="3" width="12" height="1.5" rx="0.75" fill="currentColor"/>
                    <rect x="2" y="7.25" width="8" height="1.5" rx="0.75" fill="currentColor"/>
                    <rect x="2" y="11.5" width="10" height="1.5" rx="0.75" fill="currentColor"/>
                </svg>
            </button>

            <!-- View toolbar — vertical, top right -->
            <div id="view-toolbar" class="toolbar">
                <button id="compass" class="ctrl" title="Drag to rotate view">
                    <svg id="compass-svg" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Outer ring -->
                        <circle cx="14" cy="14" r="13" stroke="rgba(0,0,0,0.08)" stroke-width="0.75"/>
                        <!-- North pointer -->
                        <path d="M14 3 L16.5 12.5 L14 11 L11.5 12.5 Z" fill="#FF3B30"/>
                        <!-- South pointer -->
                        <path d="M14 25 L11.5 15.5 L14 17 L16.5 15.5 Z" fill="#C4A882"/>
                        <!-- Center dot -->
                        <circle cx="14" cy="14" r="1.5" fill="#2d2d2d"/>
                        <!-- Cardinal ticks -->
                        <line x1="14" y1="0.5" x2="14" y2="2.5" stroke="#2d2d2d" stroke-width="0.75"/>
                        <line x1="14" y1="25.5" x2="14" y2="27.5" stroke="#C4A882" stroke-width="0.5"/>
                        <line x1="0.5" y1="14" x2="2.5" y2="14" stroke="#C4A882" stroke-width="0.5"/>
                        <line x1="25.5" y1="14" x2="27.5" y2="14" stroke="#C4A882" stroke-width="0.5"/>
                    </svg>
                </button>
                <div class="toolbar-divider"></div>
                <button id="mode-btn" class="ctrl" title="Toggle 2D/3D">3D</button>
                <div class="toolbar-divider"></div>
                <button id="zoom-in" class="ctrl" title="Zoom in">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <line x1="8" y1="3" x2="8" y2="13"/>
                        <line x1="3" y1="8" x2="13" y2="8"/>
                    </svg>
                </button>
                <button id="zoom-out" class="ctrl" title="Zoom out">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                        <line x1="3" y1="8" x2="13" y2="8"/>
                    </svg>
                </button>
            </div>

            <!-- Playback toolbar — bottom right, above profile -->
            <div id="flythrough-controls" class="toolbar toolbar-h">
                <button id="flythrough-back" class="ctrl" title="Back to beginning" style="display:none;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <rect x="1.5" y="2.5" width="1.5" height="9" fill="currentColor"/>
                        <polygon points="12,2.5 12,11.5 4,7" fill="currentColor"/>
                    </svg>
                </button>
                <button id="flythrough-btn" class="ctrl" title="Play flythrough">
                    <svg id="play-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <polygon points="3,1.5 3,12.5 12,7" fill="currentColor"/>
                    </svg>
                    <svg id="pause-icon" width="14" height="14" viewBox="0 0 14 14" fill="none" style="display:none;">
                        <rect x="2.5" y="1.5" width="3" height="11" fill="currentColor"/>
                        <rect x="8.5" y="1.5" width="3" height="11" fill="currentColor"/>
                    </svg>
                </button>
                <button id="flythrough-stop" class="ctrl" title="Stop flythrough" style="display:none;">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                        <rect x="2.5" y="2.5" width="9" height="9" fill="currentColor"/>
                    </svg>
                </button>
            </div>

            <!-- Elevation profile -->
            <div id="elevation-profile">
                <button id="profile-toggle" title="Toggle elevation profile">
                    <span id="toggle-arrow">▲</span>
                </button>
                <div id="profile-content">
                    <canvas id="profile-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
