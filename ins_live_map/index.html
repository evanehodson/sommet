<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Race Map</title>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>
    <div id="radar-pulse">
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
        <div class="radar-ring"></div>
    </div>
    <div id="top-controls">
        <div id="compass" title="Drag to rotate view">
                <div id="compass-arrow">
                    <span id="compass-n">N</span>
                    <span id="compass-arrow-icon">▲</span>
                    <span id="compass-s">S</span>
                </div>
            </div>
        <div id="button-pill">
            <button id="zoom-in">+</button>
            <button id="zoom-out">−</button>
            <button id="mode-btn">2D</button>
        </div>
    </div>
    <button id="follow-btn" title="Toggle camera follow" class="active">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <circle cx="10" cy="10" r="2" fill="currentColor"/>
            <line x1="10" y1="1" x2="10" y2="5" stroke="currentColor" stroke-width="1.5"/>
            <line x1="10" y1="15" x2="10" y2="19" stroke="currentColor" stroke-width="1.5"/>
            <line x1="1" y1="10" x2="5" y2="10" stroke="currentColor" stroke-width="1.5"/>
            <line x1="15" y1="10" x2="19" y2="10" stroke="currentColor" stroke-width="1.5"/>
        </svg>
    </button>
    <div id="connection-status" title="WebSocket connection">
        <span id="conn-dot"></span>
        <span id="conn-label">No signal</span>
    </div>
    <div id="elevation-profile">
        <button id="profile-toggle" title="Toggle elevation profile">
            <span id="toggle-arrow">▲</span>
        </button>
        <div id="profile-content">
            <canvas id="profile-canvas"></canvas>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
