<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WURL 3D Theater</title>
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <script src="https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-layout">
        <div id="scrollytelling-sidebar">
            <div id="sidebar-header">
                <h2 id="sidebar-title">The WURL</h2>
                <button id="sidebar-close" title="Close">&times;</button>
            </div>
            <div id="sidebar-scroll-container"></div>
        </div>
        <div id="map-area">
            <div id="map"></div>
            <button id="sidebar-toggle" title="Scrollytelling">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="3" y="4" width="14" height="2" rx="1" fill="currentColor"/>
                    <rect x="3" y="9" width="10" height="2" rx="1" fill="currentColor"/>
                    <rect x="3" y="14" width="12" height="2" rx="1" fill="currentColor"/>
                </svg>
            </button>
            <div id="flythrough-controls">
                <button id="flythrough-back" title="Back to beginning" style="display:none;">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <rect x="2" y="3" width="2" height="12" fill="currentColor"/>
                        <polygon points="15,3 15,15 5,9" fill="currentColor"/>
                    </svg>
                </button>
                <button id="flythrough-btn" title="Play flythrough">
                    <svg id="play-icon" width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <polygon points="4,2 4,16 15,9" fill="currentColor"/>
                    </svg>
                    <svg id="pause-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" style="display:none;">
                        <rect x="3" y="2" width="4" height="14" fill="currentColor"/>
                        <rect x="11" y="2" width="4" height="14" fill="currentColor"/>
                    </svg>
                </button>
                <button id="flythrough-stop" title="Stop flythrough">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                        <rect x="3" y="3" width="12" height="12" fill="currentColor"/>
                    </svg>
                </button>
            </div>
            <div id="top-controls">
                <div id="compass" title="Drag to rotate view">
                    <div id="compass-arrow">
                        <span id="compass-n">N</span>
                        <span id="compass-arrow-icon">&#9650;</span>
                        <span id="compass-s">S</span>
                    </div>
                </div>
                <div id="button-pill">
                    <button id="zoom-in">+</button>
                    <button id="zoom-out">&minus;</button>
                    <button id="mode-btn">2D</button>
                </div>
            </div>
            <div id="elevation-profile">
                <button id="profile-toggle" title="Toggle elevation profile">
                    <span id="toggle-arrow">&#9650;</span>
                </button>
                <div id="profile-content">
                    <canvas id="profile-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="app.js"></script>
</body>
</html>
